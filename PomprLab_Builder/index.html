    };
    document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.task){APP_STATE.taskTypeId=el.dataset.task;if(el.dataset.task!=='other')APP_STATE.customTaskType='';UI.render()}else if(el.dataset.complexity){APP_STATE.complexityId=el.dataset.complexity;const rec=RECOMMENDATION_ENGINE.recommend(APP_STATE.taskTypeId,APP_STATE.complexityId);APP_STATE.recommendedArchitectureId=rec.recommendedId;APP_STATE.recommendationReason=rec.reason;if(APP_STATE.selectionMode!=='manual')APP_STATE.selectedArchitectureId=rec.recommendedId;UI.render()}else if(el.dataset.arch){APP_STATE.selectedArchitectureId=el.dataset.arch;APP_STATE.selectionMode=el.dataset.arch===APP_STATE.recommendedArchitectureId?'recommended':'manual';UI.render()}else if(el.dataset.go)UI.go(el.dataset.go);else if(el.dataset.next){const error=UI.validateScreen(el.dataset.next);const target=document.getElementById('screenError');if(error){if(target)target.textContent=error;return}UI.go(el.dataset.next)}else if(el.dataset.add){const a=APP_STATE.values[el.dataset.add]||(APP_STATE.values[el.dataset.add]=[]);if(a.length<12)a.push('');UI.render()}else if(el.dataset.remove){const a=APP_STATE.values[el.dataset.remove]||[];a.splice(Number(el.dataset.index),1);UI.render()}else if(el.dataset.chip){const id=el.dataset.chip,val=el.dataset.chipValue;if(el.dataset.multi==='true'){const a=Array.isArray(APP_STATE.values[id])?[...APP_STATE.values[id]]:[];const i=a.indexOf(val);i>=0?a.splice(i,1):a.push(val);APP_STATE.values[id]=a}else APP_STATE.values[id]=val;UI.render()}else if(el.dataset.action==='start'){APP_STATE=freshState();APP_STATE.currentScreen='objective';UI.render()}else if(el.dataset.action==='resume'){APP_STATE=AVAILABLE_DRAFT;AVAILABLE_DRAFT=null;UI.render()}else if(el.dataset.action==='discard-draft'){STORAGE.clear();AVAILABLE_DRAFT=null;UI.render()}else if(el.dataset.action==='toggle-preview'){document.getElementById('previewPanel')?.classList.toggle('mobile-open');el.textContent=document.getElementById('previewPanel')?.classList.contains('mobile-open')?'Ocultar vista previa':'Ver vista previa y Prompt Score'}else if(el.dataset.action==='copy'){try{await navigator.clipboard.writeText(APP_STATE.generatedPrompt);UI.showToast('Prompt copiado correctamente')}catch{const range=document.createRange();range.selectNodeContents(document.getElementById('finalPrompt'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);UI.showToast('Texto seleccionado. Usa Copiar en tu dispositivo.')}}else if(el.dataset.action==='confirm-reset')UI.resetConfirm();else if(el.dataset.action==='close-modal')document.getElementById('modalRoot').innerHTML='';else if(el.dataset.action==='reset-now'){STORAGE.clear();AVAILABLE_DRAFT=null;APP_STATE=freshState();APP_STATE.currentScreen='objective';document.getElementById('modalRoot').innerHTML='';UI.render()}});
    document.addEventListener('input',e=>{const el=e.target;if(el.dataset.value!==undefined)APP_STATE[el.dataset.value]=el.value;else if(el.dataset.field)APP_STATE.values[el.dataset.field]=el.value;else if(el.dataset.custom){APP_STATE.values[el.dataset.custom+'Custom']=el.value;if(el.value.trim())APP_STATE.values[el.dataset.custom]=el.value}else if(el.dataset.repeat){const a=APP_STATE.values[el.dataset.repeat]||(APP_STATE.values[el.dataset.repeat]=[]);a[Number(el.dataset.index)]=el.value}UI.derive();STORAGE.save(APP_STATE);if(APP_STATE.currentScreen==='builder'){document.querySelector('.prompt-preview').textContent=APP_STATE.generatedPrompt||'Completa los campos para construir tu prompt profesional…';document.querySelector('.score-box').outerHTML=UI.scoreBox();const counter=el.closest('.field-block')?.querySelector('.counter');if(counter)counter.textContent=`${el.value.length}/${el.maxLength}`}});
    document.addEventListener('change',e=>{if(e.target.dataset.field){APP_STATE.values[e.target.dataset.field]=e.target.value;UI.render()}});
    UI.resetTop.addEventListener('click',()=>UI.resetConfirm());
    UI.render();
  </script>
</body>
</html>
